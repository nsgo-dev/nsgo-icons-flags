name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Check the generated files against upstream
        run: |
          commit=$(jq -r .commit upstream.json)
          git init -q "$RUNNER_TEMP/flag-icons"
          git -C "$RUNNER_TEMP/flag-icons" fetch -q --depth 1 https://github.com/lipis/flag-icons.git "$commit"
          git -C "$RUNNER_TEMP/flag-icons" checkout -q FETCH_HEAD
          go run ./tools/flaggen -check -upstream "$RUNNER_TEMP/flag-icons" -commit "$commit"
