<!doctype html>
<!-- The source of website/assets/og.png, the 1200 by 630 image link previews show. Render it with tools/siteog/render.sh. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: #ffffff;
      color: #0c0d10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }
    .text { position: absolute; left: 72px; top: 92px; width: 470px; }
    .mark { width: 72px; height: 72px; display: block; margin-bottom: 36px; }
    h1 { margin: 0 0 20px; font-size: 64px; line-height: 1.05; letter-spacing: -0.02em; }
    h1 span {
      background: linear-gradient(135deg, #d62839, #b8336a 45%, #2f5fd0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { margin: 0; font-size: 26px; line-height: 1.4; color: #666a73; }
    .shot {
      position: absolute;
      left: 600px;
      top: 64px;
      width: 760px;
      height: 620px;
      border: 1px solid #e7e8ec;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgb(16 24 40 / 5%), 0 40px 80px -32px rgb(16 24 40 / 28%);
      background: #fff;
    }
    .shot img { display: block; width: 1100px; margin: -42px 0 0 -10px; }
  </style>
</head>
<body>
  <div class="text">
    <img class="mark" src="../../website/favicon.svg" alt="" />
    <h1><span>Flag Icons</span><br />for NSGo</h1>
    <p>271 country flags for Go apps on NSGo, in 4:3 and 1:1, drawn natively from SVG.</p>
  </div>
  <div class="shot"><img src="../../website/assets/gallery.png" alt="" /></div>
</body>
</html>
